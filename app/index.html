<!doctype html>
<html lang="en" spellcheck="false">

<head>
  <meta charset="UTF-8" />
  <!-- Browser tab favicon: transparent variant blends with light/dark tabs better. -->
  <link rel="icon" type="image/png" href="logo-transparent.png" />
  <!-- iOS Home Screen / "Add to Home Screen": keep the white-bg version so it matches
       the system squircle masking convention next to other apps. -->
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- Must match `--color-telegram-bg` in App.css. iOS PWA paints
       safe-area-inset-bottom (the home-indicator strip) in this color
       when the body itself doesn't extend past the visible viewport,
       so a mismatch reads as a grey band at the bottom of the screen. -->
  <meta name="theme-color" content="#11161e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Telegram Drive" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Telegram Drive</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
